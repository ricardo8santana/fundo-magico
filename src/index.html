<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundo Mágico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">

</head>
<body>
    <header class="header">
        <h1>Fundo Mágico</h1>

        <p class="subtitle">Tranforme suas ideias em backgrounds incriveis com o poder da IA. Descreva o que você imagina e veja a magia acontecer</p>
    </header>
    <main class="container">
        <secttion class="card main-card">
            <h2 class="card-header">Descreva o background que você deseja</h2>
            <form action="from-group">
                <textarea  id="description" placeholder="Ex: um gradiente azul suave que vai do azul claro para o azul escuro" rows="5"></textarea>
                <button id="generate-btn" class="btn-magic">
                <span id="btn-text">Gerar Background Mágico</span>
            </button>
            </form>
        </secttion>
        <secttion id="preview-section" class="preview-card">

        </secttion>
        <secttion id="code-output" class="code-grid">
            <div class="card code-card">
                <h3 class="code-title">Código HTML</h3>
                <pre id="html-code" class="code-bloc"></pre>

            </div>
            <div class="card code-card">
                <h3 class="code-title">Código CSS</h3>
                <pre id="css-code" class="code-bloc"></pre>

            </div>
        </secttion>
    </main>
</body>
</html>
